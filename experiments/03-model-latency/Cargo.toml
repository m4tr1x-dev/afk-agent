[package]
name = "model-latency-probe"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Known-good-matrix question 3: what the model costs per tactical tick, with a game resident."

[lints]
workspace = true

[dependencies]
# Reading a PNG the capture probe wrote, and parsing one JSON response. The
# HTTP is written over a socket, as in the vision-encoder probe: the server is
# on loopback and a client crate is a larger surface than the code it replaces.
png = "0.18"
serde_json = "1"

[[bin]]
name = "model-latency-probe"
path = "src/main.rs"
