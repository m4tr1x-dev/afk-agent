# Link checking for afk-agent documentation.
#
# Policy: internal links are a hard failure (a broken relative link is a bug we
# introduced). External links are checked on a weekly schedule, not on pull
# requests — the web rots on its own timetable and should not block a merge.

max_concurrency = 8
max_retries = 2
timeout = 20
retry_wait_time = 2

# Some sites reject the default user agent outright.
user_agent = "Mozilla/5.0 (compatible; lychee/0.1; +https://github.com/lycheeverse/lychee)"

# Cache external results so the weekly run is cheap and reruns are fast.
cache = true
max_cache_age = "1d"

# GitHub rate-limits anonymous requests hard; CI passes a token via GITHUB_TOKEN.
require_https = false

exclude = [
  # Local development addresses that are not reachable from CI.
  "^https?://localhost",
  "^https?://127\.0\.0\.1",
  "^https?://0\.0\.0\.0",
  # Placeholder domains used in examples.
  "^https?://example\.(com|org|net)",
  # Generated API documentation does not exist until the publish workflow runs.
  "^/api/",
]

exclude_path = [
  "target",
  "site",
  "node_modules",
]

# Anchors inside generated API docs cannot be resolved before generation.
include_fragments = false
