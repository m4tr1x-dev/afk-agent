# Prose linting for afk-agent documentation.
#
# We use the Microsoft style package rather than Google's: this is a Windows
# desktop application, and Microsoft's guidance matches the platform's own
# conventions. The AfkAgent style on top of it carries the rules specific to
# this project.
#
# Alert levels: only `error` fails CI. Warnings and suggestions are advisory.
# Run `vale docs/` locally to see everything, or
# `vale --minAlertLevel=error docs/` to see what CI will fail on.
#
# Note on structure: a rule's level is declared inside its own YAML file, which
# means every AfkAgent rule is active everywhere unless switched off. They are
# therefore disabled in the global section below and re-enabled per area, so
# that a rule about specifications does not fire on a decision record.

StylesPath = styles
MinAlertLevel = warning

Packages = Microsoft

Vocab = AfkAgent

[*.md]
BasedOnStyles = Vale, Microsoft, AfkAgent

# --- Project rules: off by default, enabled per area below -----------------
AfkAgent.SpecFutureTense = NO
AfkAgent.Weasel = NO
AfkAgent.Condescending = NO
AfkAgent.BannedTerms = error
AfkAgent.CheatWord = error

# --- Vale's own rules ------------------------------------------------------
#
# Spelling is cspell's job. Running two spell checkers with two dictionaries
# means maintaining two word lists that disagree, and Vale's flags most of our
# technical vocabulary.
Vale.Spelling = NO

# --- Microsoft rules we deliberately switch off ----------------------------
#
# Contractions: Microsoft's guidance targets consumer documentation, where
# "it's" reads as friendly. A normative specification is not that. "The core
# MUST NOT block" and "the core mustn't block" are not the same register, and
# mixing them across a document reads as carelessness.
Microsoft.Contractions = NO
#
# UIVerbs wants "select" instead of "click". Here a click is a literal event the
# agent synthesises, not an instruction to a reader about operating an
# interface. Rewriting it to "select" would make the action vocabulary wrong.
Microsoft.UIVerbs = NO
#
# Dashes wants unspaced em dashes. We use spaced ones throughout — like this —
# consistently, which is the convention the prose is written in.
Microsoft.Dashes = NO
#
# Avoid flags words from an A-Z list including "backend", which is the precise
# name for a compute backend in the inference runtime we use. A general word
# list cannot tell that apart from loose usage.
Microsoft.Avoid = NO
#
# Quotes wants punctuation inside the quotation marks, which is the American
# convention. This documentation is written in British English, where
# punctuation that is not part of the quoted material sits outside it.
Microsoft.Quotes = NO
#
# Terms enforces the exact casing of every word in the project vocabulary,
# which fires on any sentence or table cell that legitimately begins with one.
# cspell already knows those words.
Vale.Terms = NO
#
# Handled per area: several areas argue in the first person plural by design.
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Auto = NO

[docs/spec/**/*.md]
# Specifications are normative, present tense, and speak about the system in
# the third person.
AfkAgent.SpecFutureTense = error
AfkAgent.Weasel = error
Microsoft.We = error
# RFC 2119 keywords are uppercase and intentional; do not flag them.
Microsoft.Terms = NO
# A specification describes what is done to things, and the passive is
# frequently the accurate voice for that.
Microsoft.Passive = NO

[docs/reference/**/*.md]
AfkAgent.Weasel = error
Microsoft.We = error
Microsoft.Passive = NO

[docs/explanation/**/*.md, docs/decisions/**/*.md, docs/contributing/**/*.md]
# Essays, records and contributor guidance argue in the first person plural.
AfkAgent.Weasel = suggestion
Microsoft.Passive = NO

[docs/tutorials/**/*.md, docs/how-to/**/*.md]
AfkAgent.Condescending = error

# These pages discuss the banned vocabulary as their subject: the glossary
# defines the substitutions, the documentation guide explains them, and the
# terms-of-service page must be able to quote the words that appear in a game's
# own terms. Applying the rules to them would make them unwritable.
[docs/glossary.md]
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

[docs/contributing/documentation-guide.md]
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

[docs/explanation/anti-cheat-and-terms-of-service.md]
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

# CLAUDE.md restates the banned-word list for coding agents, so it has to be
# able to name the words it bans, exactly as the glossary does.
[CLAUDE.md]
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

# The FAQ answers the question users actually ask — "is this a cheat?" — and it
# has to be able to use the word to answer it. The answer explains why the
# project does not use that word about itself.
[docs/faq.md]
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO
