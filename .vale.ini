# Prose linting for afk-agent documentation.
#
# We use the Microsoft style package rather than Google's: this is a Windows
# desktop application, and Microsoft's guidance matches the platform's own
# conventions. The AfkAgent style on top of it carries the rules specific to
# this project.
#
# Alert levels: only `error` fails CI. Warnings and suggestions are advisory.
# Run `vale docs/ *.md` locally to see everything, or
# `vale --minAlertLevel=error docs/ *.md` to see what CI will fail on.
#
# TWO STRUCTURAL RULES, both learned the hard way:
#
# 1. Project rules are enabled at their intended level globally and switched
#    OFF where they do not apply. The reverse — disabling globally and
#    re-enabling per area — is not portable: Vale 3.17.1 on Windows treats a
#    global `= NO` as removing the rule from the check set entirely, so a later
#    section cannot bring it back, while the CI runner's version does re-enable
#    it. That disagreement hid five real findings locally until CI caught them.
#
# 2. Every section header carries exactly ONE glob. Comma-separated globs in a
#    section header are not honoured by the same local version, which silently
#    applies none of that section's settings.
#
# Both mistakes fail in the same direction: the rule quietly does not apply and
# the build looks clean. Prefer verbosity here over cleverness.

StylesPath = styles
MinAlertLevel = warning

Packages = Microsoft

Vocab = AfkAgent

[*.md]
BasedOnStyles = Vale, Microsoft, AfkAgent

# --- Project rules --------------------------------------------------------
#
# Two gate, two advise, and the split is deliberate.
#
# SpecFutureTense, BannedTerms and CheatWord have no legitimate exceptions
# inside the text they govern, so they fail the build.
#
# Weasel and Condescending are judgement calls that a file-level linter cannot
# make. Weasel's rationale is about NORMATIVE statements — a latency budget of
# "fast" is unimplementable — but Vale cannot tell a requirement row from the
# prose around it, and "many games expose no accessibility tree" is an accurate
# statement about the world rather than a decision nobody has taken. Likewise
# "trivially detectable" is a precise technical claim, not condescension.
#
# Gating on them would mean mangling accurate prose to satisfy a rule that was
# written for a narrower target. They stay visible at warning level, annotated
# on every pull request, and enforced by review where it matters: the
# requirement tables.
AfkAgent.SpecFutureTense = error
AfkAgent.BannedTerms = error
AfkAgent.CheatWord = error
AfkAgent.Weasel = warning
AfkAgent.Condescending = warning

# --- Vale's own rules ------------------------------------------------------
#
# Spelling is cspell's job. Running two spell checkers with two dictionaries
# means maintaining two word lists that disagree, and Vale's flags most of our
# technical vocabulary.
Vale.Spelling = NO
# Terms enforces the exact casing of every word in the project vocabulary,
# which fires on any sentence or table cell that legitimately begins with one.
Vale.Terms = NO

# --- Microsoft rules we deliberately switch off ----------------------------
#
# Contractions: Microsoft's guidance targets consumer documentation, where
# "it's" reads as friendly. A normative specification is not that.
Microsoft.Contractions = NO
#
# UIVerbs wants "select" instead of "click". Here a click is a literal event the
# agent synthesises, not an instruction to a reader about operating an
# interface. Rewriting it to "select" would make the action vocabulary wrong.
Microsoft.UIVerbs = NO
#
# Dashes wants unspaced em dashes. We use spaced ones throughout — like this —
# consistently, which is the convention the prose is written in.
Microsoft.Dashes = NO
#
# Avoid flags words from an A-Z list including "backend", which is the precise
# name for a compute backend in the inference runtime we use.
Microsoft.Avoid = NO
#
# Quotes wants punctuation inside the quotation marks, which is the American
# convention. This documentation is written in British English, where
# punctuation that is not part of the quoted material sits outside it.
Microsoft.Quotes = NO
#
# Handled per area: several areas argue in the first person plural by design.
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Auto = NO

# ===========================================================================
# Normative areas. The project rules apply here, inherited from above.
# ===========================================================================

[docs/spec/*.md]
# Specifications speak about the system in the third person.
Microsoft.We = error
# RFC 2119 keywords are uppercase and intentional.
Microsoft.Terms = NO
# A specification describes what is done to things, and the passive is
# frequently the accurate voice for that.
Microsoft.Passive = NO

[docs/reference/*.md]
Microsoft.We = error
Microsoft.Passive = NO

# ===========================================================================
# Discursive areas. Essays, records and guidance argue in the first person
# plural, hedge where hedging is honest, and describe intended work
# deliberately.
# ===========================================================================

[docs/explanation/*.md]
AfkAgent.SpecFutureTense = NO
Microsoft.Passive = NO

[docs/decisions/*.md]
AfkAgent.SpecFutureTense = NO
Microsoft.Passive = NO

[docs/contributing/*.md]
AfkAgent.SpecFutureTense = NO
Microsoft.Passive = NO

[docs/tutorials/*.md]
AfkAgent.SpecFutureTense = NO

[docs/how-to/*.md]
AfkAgent.SpecFutureTense = NO

# ===========================================================================
# Home-level pages: prose about the project rather than normative text.
# ===========================================================================

[docs/index.md]
AfkAgent.SpecFutureTense = NO

[docs/vision.md]
AfkAgent.SpecFutureTense = NO

[docs/roadmap.md]
AfkAgent.SpecFutureTense = NO

[docs/known-good-matrix.md]
AfkAgent.SpecFutureTense = NO

# ===========================================================================
# Pages whose subject is the vocabulary itself. They have to be able to name
# the words they ban, and the documentation guide has to explain the rules.
# ===========================================================================

[docs/faq.md]
AfkAgent.SpecFutureTense = NO
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

[docs/glossary.md]
AfkAgent.SpecFutureTense = NO
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

[docs/contributing/documentation-guide.md]
AfkAgent.SpecFutureTense = NO
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

[docs/explanation/anti-cheat-and-terms-of-service.md]
AfkAgent.SpecFutureTense = NO
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

# ===========================================================================
# Repository root files: prose for readers, not normative text.
# ===========================================================================

[README.md]
AfkAgent.SpecFutureTense = NO

[CLAUDE.md]
AfkAgent.SpecFutureTense = NO
AfkAgent.BannedTerms = NO
AfkAgent.CheatWord = NO

