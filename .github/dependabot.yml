version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: monthly
    commit-message:
      prefix: "docs"
    # The documentation toolchain is pinned deliberately. Grouping keeps the
    # upgrade to a single reviewable pull request with the site built once.
    groups:
      docs-toolchain:
        patterns: ["*"]
