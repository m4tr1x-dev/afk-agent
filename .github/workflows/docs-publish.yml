name: docs-publish

# Builds the full documentation site and deploys it to GitHub Pages.
#
# Three generators produce one site. The hub is MkDocs; the two API sub-sites
# are static output mounted underneath it. They are generated independently and
# never cross-generated — see ADR-0001.
#
#   /              MkDocs Material  — specification, decisions, guides
#   /api/rust/     cargo doc        — the Rust core
#   /api/dotnet/   DocFX            — the C# shell
#
# The API steps are guarded: until the code exists there is nothing to generate,
# and a missing manifest should not fail the documentation deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress; a half-deployed site is worse than a stale
# one. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The Rust reference is built on Windows and carried to the deploy job as an
  # artefact.
  #
  # It cannot be built beside the hub. `CON-001` makes the workspace Windows
  # only: `afk-input` declares `user32` and `rust-toolchain.toml` pins a single
  # Windows target. Building it on the Linux runner that builds the hub worked
  # only for as long as every crate was declarations; the first crate that
  # actually calls into the platform would have failed the documentation
  # deploy, in a workflow nobody associates with the Rust build.
  rust-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the Rust API reference
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - uses: actions/upload-artifact@v4
        with:
          name: rust-api
          path: target/doc
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: rust-api
    steps:
      - uses: actions/checkout@v7
        with:
          # mkdocs-git-revision-date and similar plugins need history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned documentation toolchain
        run: pip install -r docs/requirements.txt

      - name: Build the hub
        run: mkdocs build --strict

      - uses: actions/download-artifact@v4
        with:
          name: rust-api
          path: site/api/rust

      - name: Check for a DocFX configuration
        id: docfx
        run: |
          if [ -f tools/docfx/docfx.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No docfx.json yet; skipping the .NET API reference."
          fi

      # The version comes from `.config/dotnet-tools.json` rather than from this
      # file. `dotnet tool install -g docfx` installs whatever is newest on the
      # day the workflow runs, which contradicts the pinning discipline the
      # known-good matrix applies to everything else in the build.
      - uses: actions/setup-dotnet@v4
        if: steps.docfx.outputs.present == 'true'
        with:
          global-json-file: global.json

      - name: Build the .NET API reference
        if: steps.docfx.outputs.present == 'true'
        run: |
          dotnet tool restore
          dotnet docfx tools/docfx/docfx.json
          mkdir -p site/api/dotnet
          cp -r tools/docfx/_site/. site/api/dotnet/

      # `enablement: true` turns Pages on for the repository if it is not
      # already, rather than failing with "Get Pages site failed. Not Found",
      # which is what a first push to a repository without Pages configured
      # produces. It needs the `pages: write` permission granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
