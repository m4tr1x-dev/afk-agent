"""

[[title]]
name = "breathedge"
display = "Breathedge"
engine = "Unreal Engine 4"
licence = "proprietary"
synthesis_allowed = true
terms = "silent"
terms_reviewed = ""
notes = """
Commercial, single-player only. Used as the control on a commercial-lineage \
engine. Its frames are not committed to this repository; evidence for it lives \
outside the working tree. The publisher's agreement has not been assembled into \
a clause pack yet, so `terms` is silent rather than anything stronger.
"""

[[title]]
name = "roblox"
display = "Roblox"
engine = "Roblox"
licence = "proprietary"
synthesis_allowed = false
terms = "prohibits"
terms_reviewed = ""
notes = """
Capture only, never synthesis. It exposes a real interface tree, which makes it \
valuable ground truth for the corpus, and its terms prohibit automation, which \
makes it ineligible for anything that sends input. Both facts are true at once \
and the second one wins wherever they meet.
"""

[[title]]
name = "fortnite"
display = "Fortnite"
engine = "Unreal Engine 5"
licence = "proprietary"
synthesis_allowed = false
terms = "prohibits"
terms_reviewed = ""
notes = """
Competitive multiplayer, excluded by ADR-0025 as a use case and as a direction \
of contribution, independently of what its terms say. Listed here so that the \
exclusion is enforced rather than remembered.
"""

[[title]]
name = "gta-v"
display = "Grand Theft Auto V"
engine = "RAGE"
licence = "proprietary"
synthesis_allowed = false
terms = "silent"
terms_reviewed = ""
notes = """
Story mode would be in scope; the online mode is competitive multiplayer and is \
not, and nothing in this roster can tell the two apart from outside the game. \
False until that is resolved, because the failure mode of guessing wrong here \
is somebody's account.
"""
