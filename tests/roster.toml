# The titles this project is allowed to point a probe at, and what it may do to
# each of them.
#
# This file is read at run time and it refuses things. That is the whole point.
# `ADR-0025` excludes competitive multiplayer as a use case and as a direction,
# and the terms of some titles prohibit automation outright — and a rule of that
# kind, written in a decision record and nowhere else, is a rule somebody
# eventually works around at two in the morning with a good reason.
#
# So: `synthesis_allowed = false` means the reachability probe and the harness
# will not run against the title, and say so rather than doing it anyway. The
# difference between "we wrote it down" and "the tool will not do it" is the
# whole difference.
#
# `terms` takes exactly one of three values, and the scale is deliberately
# coarse:
#
#   prohibits   a quoted clause forbids automation
#   silent      the terms do not address it, or the reading is arguable
#   permits     a quoted clause allows it
#
# **Anything ambiguous is `silent`, never `permits`.** `permits` requires a
# clause quoted verbatim in docs/reference/terms/, and until that page exists
# for a title, the honest value is `silent`. An open-source licence that says
# nothing about automation is `silent`, not `permits` - a licence grants rights
# over the software, and saying nothing about a use is not the same as allowing
# it. The distinction costs nothing and keeps the column meaningful.
#
# `terms_reviewed` is the date a person read the pack, not the date the agent
# assembled it. Known-good-matrix question 8 is not closable without that
# signature, and an unsigned entry is recorded as such.

schema_version = 1

[[title]]
name = "xonotic"
display = "Xonotic"
engine = "DarkPlaces"
licence = "GPL-2.0-or-later"
synthesis_allowed = true
terms = "silent"
terms_reviewed = ""
notes = """
Open source, single-player and local matches used. Reached in E1 at 0.892 \
columns per unit, R2 0.957. Started with cl_allow_uidtracking 0 from the \
command line rather than by answering its consent prompt, because clicking \
through a consent dialogue is not something this project does on a user's \
behalf.
"""

[[title]]
