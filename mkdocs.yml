site_name: afk-agent
site_description: An autonomous computer-use agent that plays PC games from a natural-language prompt.
site_url: https://m4tr1x-dev.github.io/afk-agent/
repo_url: https://github.com/m4tr1x-dev/afk-agent
repo_name: m4tr1x-dev/afk-agent
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 M4tr1x-dev — MIT licensed

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.saneheaders
  # Snippets is the anti-drift mechanism: documentation includes code from real
  # source files by marker, and `mkdocs build --strict` fails when a marker is
  # deleted or renamed. Never paste code into a page by hand.
  - pymdownx.snippets:
      base_path:
        - docs/snippets
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        # Mermaid renders natively on GitHub and here from the same fence, so a
        # reviewer sees diagrams in the pull request diff without a build step.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - tags

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/m4tr1x-dev/afk-agent

